[project]
name = "mw-ha-lumina"
version = "1.0.0"
description = "MW Lúmina — iluminação circadiana por ambiente para o Home Assistant (motor local, offline-first)"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Maycon Willian Oliveira", email = "visaodeempresa@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Home Automation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "B", "A", "C4", "T10", "EM", "RUF"]
ignore = ["EM101", "EM102", "RUF001", "RUF002", "RUF003", "N806"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
